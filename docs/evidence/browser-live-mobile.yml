          - paragraph [ref=f3e149]:
            - strong [ref=f3e150]: Each level shares an epoch.
            - text: Up to five levels execute per sell. Anyone can execute eligible remaining levels. The limit is 1,200 ticks beyond the trigger, about 11% lower in ETH price.
